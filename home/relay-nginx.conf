# Add inside the http {} block of the nginx that serves your relay domain's TLS (certificate for YOUR_RELAY_DOMAIN).
# Two servers: the bot's callback comes in over HTTPS and goes through the tunnel to the gateway (only
# POST /bot-reply/<id>/<one-time token>); the gateway's Webhook goes out through the tunnel to the loopback server.
server {
    listen 443 ssl;                                  # adapt to how TLS reaches this nginx
    server_name YOUR_RELAY_DOMAIN;
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    client_max_body_size 64k;
    location ~ "^/bot-reply/[0-9a-f]{16}/[0-9a-f]{32}$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}
server {
    listen 127.0.0.1:18790;
    access_log off;                                  # the Webhook path is a secret
    location / {
        proxy_http_version 1.1;                      # HTTP/1.0 gets "426 Upgrade Required" from some bots
        proxy_pass https://YOUR_WEBHOOK_HOST;
        proxy_ssl_server_name on;
        proxy_set_header Host YOUR_WEBHOOK_HOST;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }
}

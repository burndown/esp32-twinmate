name = "muse-home-gateway"
main = "src/index.js"
compatibility_date = "2026-10-01"

# KV is simulated on disk (wrangler dev --local --persist-to state): settings, keys and chat memory live in ./state
[[kv_namespaces]]
binding = "CFG"
id = "home-local"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

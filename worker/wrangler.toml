name = "muse-gateway"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 1. npx wrangler kv namespace create muse-gateway-cfg   -> put the printed id below
# 2. npx wrangler secret put GATEWAY_TOKEN                -> a long random string; the firmware sends it as ?k=
# 3. deploy, open https://<your worker>.workers.dev/admin?k=<token> and fill in the rest there
[[kv_namespaces]]
binding = "CFG"
id = "REPLACE_WITH_KV_ID"

# Workers AI (speech recognition with Whisper; free allowance of 10,000 neurons a day)
[ai]
binding = "AI"

# The state of each Grok Bot question lives in a Durable Object (KV would delay the bot's answer by up to a minute)
[[durable_objects.bindings]]
name = "BOT"
class_name = "BotWait"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotWait"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

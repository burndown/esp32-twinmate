name = "muse-gateway"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 1. npx wrangler kv namespace create muse-gateway-cfg      -> put the printed id below
# 2. npx wrangler secret put GATEWAY_TOKEN                   -> a long random string; the firmware sends it as ?k=
# 3. (optional) npx wrangler secret put DASHSCOPE_API_KEY    -> or enter every key on the /admin page instead
[[kv_namespaces]]
binding = "CFG"
id = "REPLACE_WITH_KV_ID"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Workers AI (free allowance of 10,000 neurons a day): lets the settings page offer "Cloudflare Workers AI" for speech recognition. Not needed otherwise.
[ai]
binding = "AI"

# Grok Bot (Webhook bot) answers arrive as a separate request; a Durable Object holds each question's state so the answer is seen at once
# (KV is only eventually consistent). Without this binding the Worker falls back to KV, which can delay the answer by up to a minute.
[[durable_objects.bindings]]
name = "BOT"
class_name = "BotWait"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotWait"]
